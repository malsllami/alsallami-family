# ═══════════════════════════════════════════════════════════════════════════
# keep-supabase-alive — نبض دوري بسيط يمنع توقف مشروع Supabase المجاني
# (يتوقف تلقائيًا بعد 7 أيام بلا نشاط). يقرأ صفًا واحدًا عامًا فقط (View
# "الإعدادات العامة") — قراءة بحتة بلا أي كتابة أو تسجيل إحصائيات، حتى لا
# يؤثر على عداد الزيارات الحقيقي أو أي بيانات أخرى.
# ═══════════════════════════════════════════════════════════════════════════
name: Keep Supabase Alive

on:
  schedule:
    # كل 3 أيام الساعة 03:00 UTC — هامش أمان واسع قبل حد التوقف (7 أيام)
    - cron: '0 3 */3 * *'
  workflow_dispatch: # يسمح بتشغيلها يدويًا من تبويب Actions للاختبار

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (قراءة بسيطة تُبقي المشروع نشطًا)
        run: |
          curl -sf -o /dev/null \
            "https://smdyaausztnoghcuclfl.supabase.co/rest/v1/%D8%A7%D9%84%D8%A5%D8%B9%D8%AF%D8%A7%D8%AF%D8%A7%D8%AA%20%D8%A7%D9%84%D8%B9%D8%A7%D9%85%D8%A9?select=*" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
