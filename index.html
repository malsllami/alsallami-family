<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>قبيلة السلامي</title>

    <!-- وسوم Open Graph — تُظهر شعار الموقع تلقائياً ضمن بطاقة المعاينة عند مشاركة رابط الموقع عبر واتساب وغيره -->
    <!-- Open Graph tags — surface the site logo automatically in link-preview cards (WhatsApp, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="قبيلة السلامي — الفخذ العفاريت" />
    <meta property="og:description" content="الموقع الرسمي لقبيلة السلامي" />
    <meta property="og:url" content="https://malsllami.github.io/alsallami-family/" />
    <meta property="og:image" content="https://malsllami.github.io/alsallami-family/og-image.png" />
    <meta property="og:image:secure_url" content="https://malsllami.github.io/alsallami-family/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <!-- SPA routing fix for GitHub Pages -->
    <script>
      (function(){
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
